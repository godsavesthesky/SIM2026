                    <label class="text-sm font-medium text-black">No. Telepon</label>

                    <div class="border border-gray-200 rounded-full px-5 py-3 text-sm bg-gray-50 text-gray-600">Perempuan</div>

                <div class="flex flex-col gap-2 sm:col-span-2">

                    <div class="border border-gray-200 rounded-full px-5 py-3 text-sm bg-gray-50 text-gray-600">Jl. Mega Elektronik No. 10, Surabaya</div>

            <div class="flex items-center justify-end mt-8">
