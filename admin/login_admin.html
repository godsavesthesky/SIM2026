<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="../Assets/nama-logo-kamu.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <title>Login | Admin</title>
</head>
<body class="bg-white flex flex-col min-h-screen items-center justify-center p-6">

    <div class="w-full max-w-5xl bg-white rounded-3xl border border-gray-200 shadow-sm grid grid-cols-1 lg:grid-cols-2 overflow-hidden">

        <!-- Kiri: Branding -->
        <div class="border-r border-gray-100 p-10 lg:p-12 flex flex-col items-center justify-center text-center gap-6">
            <img src="Asset SIM Modul 2\logo\Logo.png" alt="Mega Electronic" class="w-28 h-28 object-contain">
            <p class="text-lg font-semibold text-black" style="font-family: Georgia, serif; letter-spacing: 0.15em;">MEGA ELECTRONIC</p>

            <div class="mt-6">
                <h1 class="text-3xl font-bold text-black">Welcome <span class="text-[#4A7EE0]">Back!</span></h1>
                <p class="text-gray-500 mt-2 text-sm leading-relaxed">Login to access your<br>admin dashboard</p>
                <div class="w-20 h-0.5 bg-black mx-auto mt-4"></div>
            </div>
        </div>

        <!-- Kanan: Form -->
        <div class="p-10 lg:p-12 flex flex-col justify-center gap-5">

            <div class="inline-flex items-center gap-2 bg-[#2E2E2E] text-white px-5 py-3 rounded-full w-fit">
                <svg class="w-5 h-5 text-[#4A7EE0]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                <span class="font-medium text-sm">Admin Access</span>
            </div>

            <p class="text-gray-400 text-sm">Please enter your credentials to continue</p>

            <div class="flex flex-col gap-4">

                <label class="flex items-center gap-3 border border-gray-200 rounded-full px-5 py-3.5 focus-within:border-[#4A7EE0] transition">
                    <svg class="w-5 h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m2 7 10 6 10-6"></path>
                    </svg>
                    <input type="email" name="email" placeholder="Email" class="w-full outline-none text-sm bg-transparent">
                </label>

                <label class="flex items-center gap-3 border border-gray-200 rounded-full px-5 py-3.5 focus-within:border-[#4A7EE0] transition">
                    <svg class="w-5 h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input id="password" type="password" name="password" placeholder="Password" class="w-full outline-none text-sm bg-transparent">
                    <button type="button" id="togglePassword" class="shrink-0 text-gray-400">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </label>

                <div class="flex items-center justify-between text-sm pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-gray-300">
                        Remember me
                    </label>
                    <a href="#" class="text-[#4A7EE0] hover:underline">Forgot Password?</a>
                </div>

                <a href="db_admin.html" class="mt-2 w-full flex items-center justify-center gap-2 bg-[#2E2E2E] hover:bg-black text-white font-medium py-3.5 rounded-full transition">
                    Login
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M13 6l6 6-6 6"></path>
                    </svg>
                </a>

                <div class="flex items-center gap-3 py-1">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-xs text-gray-400">Or</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <a href="../FO/login_fo.html" class="flex items-center gap-3 border border-gray-200 rounded-full px-4 py-3 hover:border-[#4A7EE0] transition">
                        <svg class="w-8 h-8 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="10" r="3"></circle>
                            <path d="M6.5 19a6 6 0 0 1 11 0"></path>
                        </svg>
                        <span class="text-xs text-gray-500 leading-tight">Login as<br><span class="text-[#4A7EE0] font-medium">Front Office</span></span>
                    </a>
                    <a href="../User/login_user.html" class="flex items-center gap-3 border border-gray-200 rounded-full px-4 py-3 hover:border-[#4A7EE0] transition">
                        <svg class="w-8 h-8 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="10" r="3"></circle>
                            <path d="M6.5 19a6 6 0 0 1 11 0"></path>
                        </svg>
                        <span class="text-xs text-gray-500 leading-tight">Login as<br><span class="text-emerald-500 font-medium">Customer</span></span>
                    </a>
                </div>

                <p class="text-center text-sm text-gray-400 mt-2">Don't have an account? <a href="#" class="text-[#4A7EE0] hover:underline">Register Now</a></p>

            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>
</html>
