<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="../Assets/logo.png">

    <title>Edit Front Office | Admin</title>
</head>
<body class="flex bg-gray-50 min-h-screen overflow-x-hidden">

        <div class="flex flex-col items-center text-center mb-8">
            <img src="Asset SIM Modul 2\logo\Logo.png" alt="Mega Electronic" class="w-10 h-10 lg:w-16 lg:h-16 object-contain">
            <p class="hidden lg:block text-white text-sm font-semibold mt-2" style="font-family: Georgia, serif; letter-spacing: 0.15em;">
                MEGA ELECTRONIC
            </p>
        </div>

        <nav class="flex flex-col flex-1 gap-2">

            <a href="db_admin.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
                    <path d="M9 22V12h6v10"></path>
                </svg>
                <span class="hidden lg:block mx-3">Dashboard</span>
            </a>

            <a href="stock_produk1.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16v4H4z"></path>
                    <path d="M4 8v12h16V8"></path>
                    <path d="M10 12h4"></path>
                </svg>
                <span class="hidden lg:block mx-3">Stock</span>
            </a>

            <a href="daftar_fo.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white bg-white/10 border border-white rounded-xl font-bold transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span class="hidden lg:block mx-3">Daftar Front Office</span>
            </a>

            <a href="daftar_pengguna.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <path d="M20 8v6M23 11h-6"></path>
                </svg>
                <span class="hidden lg:block mx-3">Daftar Pengguna</span>
            </a>

            <a href="riwayat_transaksi.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="hidden lg:block mx-3">Riwayat Transaksi</span>
            </a>

        </nav>

        <a href="login_admin.html"
           class="flex items-center justify-center gap-2 bg-[#EF6C6C] hover:bg-red-400 text-white text-sm font-medium py-3 rounded-full transition">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path>
            </svg>
            <span class="hidden lg:block">Logout</span>
        </a>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="flex-1 ml-20 lg:ml-64 flex flex-col gap-6 px-4 sm:px-8 py-8 transition-all duration-300">

        <!-- Card: Header -->
        <div class="bg-white border border-gray-200 rounded-2xl p-6 sm:p-8">
            <h1 class="text-2xl font-bold text-black">Edit Data Front Office</h1>
            <p class="text-sm mt-1">
                <a href="daftar_fo.html" class="text-[#4A7EE0] font-medium hover:underline">Front Office</a>
                <span class="text-gray-400"> &nbsp; Edit Data Front Office</span>
            </p>
        </div>

        <!-- Card: Form (terisi data lama) -->
        <div class="bg-white border border-gray-200 rounded-2xl p-6 sm:p-8">

            <div class="flex flex-col gap-5">

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-black">Nama Lengkap</label>
                    <input type="text" value="Jihan Sac" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Email</label>
                        <input type="email" value="jihan.sac@email.com" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">No. Telepon</label>
                        <input type="tel" value="085111210828" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Tanggal Lahir</label>
                        <input type="date" value="2000-05-14" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Gender</label>
                        <select class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition text-black">
                            <option value="Perempuan" selected>Perempuan</option>
                            <option value="Laki-laki">Laki-laki</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Hari Kerja</label>
                        <div class="grid grid-cols-2 gap-3">
                            <select class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition text-black">
                                <option value="Senin" selected>Senin</option>
                                <option>Selasa</option>
                                <option>Rabu</option>
                                <option>Kamis</option>
                                <option>Jumat</option>
                                <option>Sabtu</option>
                                <option>Minggu</option>
                            </select>
                            <select class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition text-black">
                                <option>Senin</option>
                                <option>Selasa</option>
                                <option value="Rabu" selected>Rabu</option>
                                <option>Kamis</option>
                                <option>Jumat</option>
                                <option>Sabtu</option>
                                <option>Minggu</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Jam Kerja</label>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="time" value="08:00" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                            <input type="time" value="17:00" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-black">Alamat</label>
                    <input type="text" value="Jl. Mega Elektronik No. 10, Surabaya" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Password</label>
                        <input type="password" placeholder="Kosongkan jika tidak diubah" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Konfirmasi Password</label>
                        <input type="password" placeholder="Kosongkan jika tidak diubah" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 mt-4">
                    <a href="daftar_fo.html" class="border border-gray-300 hover:border-black text-sm font-medium px-8 py-3 rounded-full transition">Batal</a>
                    <a href="daftar_fo.html" class="bg-[#4A7EE0] hover:bg-blue-600 text-white text-sm font-medium px-8 py-3 rounded-full transition">Update</a>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
