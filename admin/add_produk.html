<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="../Asset%20SIM%20Modul%202/logo/Logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <title>Tambah Produk | Admin</title>
</head>
<body class="flex bg-gray-50 min-h-screen overflow-x-hidden">

    <!-- ===== SIDEBAR ===== -->
    <aside class="flex flex-col fixed top-0 left-0 z-50 w-20 lg:w-64 h-screen px-2 lg:px-4 py-6
                   bg-[#4A7EE0] transition-all duration-300">

        <div class="flex flex-col items-center text-center mb-8">
            <img src="../Asset%20SIM%20Modul%202/logo/Logo.png" alt="Mega Electronic" class="w-10 h-10 lg:w-16 lg:h-16 object-contain">
            <p class="hidden lg:block text-white text-sm font-semibold mt-2" style="font-family: Georgia, serif; letter-spacing: 0.15em;">
                MEGA ELECTRONIC
            </p>
        </div>

        <nav class="flex flex-col flex-1 gap-2">

            <a href="db_admin.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
                    <path d="M9 22V12h6v10"></path>
                </svg>
                <span class="hidden lg:block mx-3">Dashboard</span>
            </a>

            <a href="stock_produk1.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white bg-white/10 border border-white rounded-xl font-bold transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16v4H4z"></path>
                    <path d="M4 8v12h16V8"></path>
                    <path d="M10 12h4"></path>
                </svg>
                <span class="hidden lg:block mx-3">Stock</span>
            </a>

            <a href="daftar_fo.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span class="hidden lg:block mx-3">Daftar Front Office</span>
            </a>

            <a href="daftar_pengguna.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <path d="M20 8v6M23 11h-6"></path>
                </svg>
                <span class="hidden lg:block mx-3">Daftar Pengguna</span>
            </a>

            <a href="riwayat_transaksi.html"
               class="flex items-center justify-center lg:justify-start px-3 lg:px-4 py-3
                      text-white hover:bg-white/10 rounded-xl transition">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="hidden lg:block mx-3">Riwayat Transaksi</span>
            </a>

        </nav>

        <a href="login_admin.html"
           class="flex items-center justify-center gap-2 bg-[#EF6C6C] hover:bg-red-400 text-white text-sm font-medium py-3 rounded-full transition">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path>
            </svg>
            <span class="hidden lg:block">Logout</span>
        </a>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="flex-1 ml-20 lg:ml-64 flex flex-col gap-6 px-4 sm:px-8 py-8 transition-all duration-300">

        <!-- Card: Header -->
        <div class="bg-white border border-gray-200 rounded-2xl p-6 sm:p-8">
            <h1 class="text-2xl font-bold text-black">Tambah Data Produk</h1>
            <p class="text-sm mt-1">
                <a href="stock_produk1.html" class="text-[#4A7EE0] font-medium hover:underline">Stock</a>
                <span class="text-gray-400"> &nbsp; Tambah Data Produk</span>
            </p>
        </div>

        <!-- Card: Form (2 kolom: form kiri, preview foto kanan) -->
        <div class="bg-white border border-gray-200 rounded-2xl p-6 sm:p-8">

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                <!-- Kolom kiri: form input (2/3 lebar) -->
                <div class="lg:col-span-2 flex flex-col gap-5">

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Pilih Kategori</label>
                        <select class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition text-gray-400">
                            <option value="" selected disabled>Pilih kategori produk</option>
                            <option value="Gadget">Gadget</option>
                            <option value="Networking">Networking</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Nama Produk</label>
                        <input type="text" placeholder="Masukan nama produk" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Harga Produk</label>
                        <input type="text" placeholder="Rp 0" class="border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-black">Deskripsi Produk</label>
                        <textarea rows="4" placeholder="Masukan deskripsi produk" class="border border-gray-200 rounded-2xl px-5 py-3 text-sm outline-none focus:border-[#4A7EE0] transition resize-none"></textarea>
                    </div>

                </div>

                <!-- Kolom kanan: preview upload foto (1/3 lebar) -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-black">Foto Produk</label>
                    <div class="flex flex-col items-center justify-center gap-3 bg-gray-100 rounded-2xl h-56 lg:h-64 border border-gray-200">
                        <svg class="w-10 h-10 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <path d="m21 15-5-5L5 21"></path>
                        </svg>
                        <p class="text-xs text-gray-400 px-6 text-center">Preview foto produk akan tampil di sini</p>
                    </div>
                    <label class="mt-1 flex items-center justify-center border border-gray-300 hover:border-black text-sm font-medium py-3 rounded-full transition cursor-pointer">
                        Pilih foto
                        <input type="file" accept="image/*" class="hidden">
                    </label>
                </div>

            </div>

            <div class="flex items-center justify-end gap-3 mt-8">
                <a href="stock_produk1.html" class="border border-gray-300 hover:border-black text-sm font-medium px-8 py-3 rounded-full transition">Batal</a>
                <a href="stock_produk1.html" class="bg-[#4A7EE0] hover:bg-blue-600 text-white text-sm font-medium px-8 py-3 rounded-full transition">Simpan</a>
            </div>

        </div>

    </main>

</body>
</html>
