<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="../Asset%20SIM%20Modul%202/logo/Logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <title>Login | Front Office</title>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4 overflow-x-hidden">

    <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 border border-gray-200 rounded-3xl overflow-hidden bg-white">

        <!-- ===== LEFT: Brand ===== -->
        <div class="flex flex-col items-center justify-center text-center gap-6 p-8 sm:p-10 md:p-12 border-b md:border-b-0 md:border-r border-gray-200">
            <img src="../Asset%20SIM%20Modul%202/logo/Logo.png" alt="Mega Electronic" class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 object-contain">
            <p class="text-sm sm:text-base font-semibold tracking-widest" style="font-family: Georgia, serif;">MEGA ELECTRONIC</p>

            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-black">
                    Welcome <span class="text-[#4A7EE0]">Back!</span>
                </h1>
                <p class="text-xs sm:text-sm font-semibold text-black mt-2 pb-2 border-b border-black inline-block">
                    Login to access your admin dashboard
                </p>
            </div>
        </div>

        <!-- ===== RIGHT: Form ===== -->
        <div class="flex flex-col justify-center gap-5 p-8 sm:p-10 md:p-12">

            <div class="flex items-center gap-3 bg-[#2E2E2E] text-white rounded-full px-4 sm:px-5 py-2.5 sm:py-3 w-fit">
                <svg class="w-4 sm:w-5 h-4 sm:h-5 text-[#4A7EE0] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span class="font-semibold text-xs sm:text-sm">Front Office Access</span>
            </div>

            <p class="text-xs sm:text-sm text-gray-400">Please enter your credentials to continue</p>

            <form class="flex flex-col gap-4">

                <label class="flex items-center gap-3 border border-gray-300 rounded-full px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                    <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m2 7 10 6 10-6"></path>
                    </svg>
                    <input type="email" placeholder="Email Address" class="w-full outline-none text-xs sm:text-sm bg-transparent">
                </label>

                <label class="flex items-center gap-3 border border-gray-300 rounded-full px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                    <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" placeholder="Password" class="w-full outline-none text-xs sm:text-sm bg-transparent">
                    <svg class="w-4 sm:w-5 h-4 sm:h-5 text-gray-400 shrink-0 cursor-pointer hover:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </label>

                <div class="flex items-center justify-between text-xs sm:text-sm">
                    <label class="flex items-center gap-2 font-medium cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 border-gray-300 rounded">
                        Remember me
                    </label>
                    <a href="reset_password.html" class="text-[#4A7EE0] font-medium hover:underline">Forgot Password?</a>
                </div>

                <!-- FIX: dulu <button type="submit"> tanpa action -> gak "konek" kemana-mana. Sekarang <a href> ke dashboard FO -->
                <a href="db_fo.html"
                   class="flex items-center justify-center gap-2 bg-[#2E2E2E] hover:bg-black text-white font-semibold py-2.5 sm:py-3 rounded-full transition mt-2">
                    Login
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </a>

                <div class="flex items-center gap-3 py-1">
                    <span class="flex-1 h-px bg-gray-200"></span>
                    <span class="text-xs text-gray-400">Or</span>
                    <span class="flex-1 h-px bg-gray-200"></span>
                </div>

                <div class="grid grid-cols-2 gap-3 sm:gap-4">
                    <a href="../admin/login_admin.html"
                       class="flex items-center justify-center gap-2 border border-gray-300 rounded-full px-3 sm:px-4 py-2 sm:py-3 hover:border-black transition text-xs sm:text-sm">
                        <svg class="w-5 sm:w-6 h-5 sm:h-6 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="10" r="3"></circle>
                            <path d="M6.5 19c1-2.5 3-4 5.5-4s4.5 1.5 5.5 4"></path>
                        </svg>
                        <span class="hidden sm:block font-medium">Login as<br><span class="text-[#4A7EE0]">Administrator</span></span>
                        <span class="sm:hidden font-medium text-[#4A7EE0]">Admin</span>
                    </a>

                    <a href="../user/login_awal.html"
                       class="flex items-center justify-center gap-2 border border-gray-300 rounded-full px-3 sm:px-4 py-2 sm:py-3 hover:border-black transition text-xs sm:text-sm">
                        <svg class="w-5 sm:w-6 h-5 sm:h-6 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path>
                        </svg>
                        <span class="hidden sm:block font-medium">Login as<br><span class="text-emerald-500">Customer</span></span>
                        <span class="sm:hidden font-medium text-emerald-500">Customer</span>
                    </a>
                </div>

                <p class="text-center text-xs sm:text-sm text-gray-400 mt-2">
                    Don't have an account?
                    <a href="../user/register.html" class="text-[#4A7EE0] font-medium hover:underline">Register Now</a>
                </p>

            </form>
        </div>

    </div>

</body>
</html>
