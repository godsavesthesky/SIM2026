<!DOCTYPE html>

<head>

<body class="bg-white overflow-x-hidden">

    <!-- ===== NAVBAR ===== -->

        <div class="flex items-center gap-2">
            <img src="../asset/logo.png" alt="Mega Electronic" class="w-8 h-8 object-contain">
        </div>

        <div class="hidden lg:flex items-center gap-8 text-sm font-medium text-gray-700">
            <a href="home_user.html" class="hover:text-[#4A7EE0] transition">Home</a>
            <a href="produk1_user.html" class="hover:text-[#4A7EE0] transition">Product</a>
            <a href="produk1_user.html" class="hover:text-[#4A7EE0] transition">Gadget</a>

        <div class="flex items-center gap-4">

                <svg class="w-4 h-4 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" placeholder="Search products..." class="bg-transparent outline-none text-sm w-full">
            </label>

            <a href="profile.html" class="w-9 h-9 flex items-center justify-center rounded-full bg-black text-white hover:bg-gray-800 transition" title="Akun">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                </svg>
            </a>
            <a href="order.html" class="w-9 h-9 flex items-center justify-center rounded-full border border-black bg-black/5 transition" title="Keranjang">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>

                </svg>

        </div>

    <!-- ===== KERANJANG ===== -->
    <main class="max-w-4xl mx-auto px-6 sm:px-10 py-10 sm:py-14">

        <h1 class="text-2xl sm:text-3xl font-bold text-black mb-8">Keranjang Belanja</h1>

        <div class="flex flex-col gap-5">

            <!-- Item 1 -->
            <div class="flex items-center justify-between gap-6 bg-white border border-gray-200 rounded-3xl p-5 sm:p-6">
                <div class="flex items-center gap-4 sm:gap-6 min-w-0">
                    <input type="checkbox" checked class="w-5 h-5 rounded border-gray-300 shrink-0">
                    <div class="w-20 h-20 sm:w-24 sm:h-24 shrink-0 rounded-xl border border-gray-200 flex items-center justify-center overflow-hidden">

                    </div>
                    <div class="min-w-0">
                        <h3 class="font-semibold text-black">GPS Tracker</h3>
                        <p class="text-sm text-gray-500 mt-1">Rp 599.000</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 sm:gap-5 shrink-0">
                    <div class="flex items-center gap-3 border border-gray-300 rounded-full px-3 py-1.5">
                        <button type="button" class="w-6 h-6 flex items-center justify-center rounded-full bg-gray-100 font-bold">-</button>
                        <span class="text-sm font-medium w-6 text-center">1</span>
                        <button type="button" class="w-6 h-6 flex items-center justify-center rounded-full bg-gray-100 font-bold">+</button>

                    <button type="button" class="text-gray-400 hover:text-red-500 transition" title="Hapus">

                    </button>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="flex items-center justify-between gap-6 bg-white border border-gray-200 rounded-3xl p-5 sm:p-6">

                    <input type="checkbox" checked class="w-5 h-5 rounded border-gray-300 shrink-0">
                    <div class="w-20 h-20 sm:w-24 sm:h-24 shrink-0 rounded-xl border border-gray-200 flex items-center justify-center overflow-hidden">
                        <img src="../asset/smart%20ring.png" alt="Smart Ring" class="w-4/5 h-4/5 object-contain">
                    </div>
                    <div class="min-w-0">
                        <h3 class="font-semibold text-black">Smart Ring</h3>
                        <p class="text-sm text-gray-500 mt-1">Rp 599.000</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 sm:gap-5 shrink-0">
                    <div class="flex items-center gap-3 border border-gray-300 rounded-full px-3 py-1.5">
                        <button type="button" class="w-6 h-6 flex items-center justify-center rounded-full bg-gray-100 font-bold">-</button>
                        <span class="text-sm font-medium w-6 text-center">1</span>
                        <button type="button" class="w-6 h-6 flex items-center justify-center rounded-full bg-gray-100 font-bold">+</button>
                    </div>
                    <button type="button" class="text-gray-400 hover:text-red-500 transition" title="Hapus">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Ringkasan -->
            <div class="bg-white border border-gray-200 rounded-3xl p-6 sm:p-8 mt-4">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm text-gray-500">Subtotal</span>
                    <span class="font-medium text-black">Rp 1.198.000</span>
                </div>
                <div class="flex items-center justify-between mb-6">
                    <span class="text-sm text-gray-500">Ongkos Kirim</span>
                    <span class="font-medium text-black">Gratis</span>
                </div>
                <div class="flex items-center justify-between border-t border-gray-200 pt-4 mb-6">
                    <span class="font-semibold text-black">Total</span>
                    <span class="font-bold text-lg text-black">Rp 1.198.000</span>
                </div>
                <a href="detail_user.html"
                   class="flex items-center justify-center gap-2 bg-[#2E2E2E] hover:bg-black text-white font-semibold py-3 rounded-full transition">
                    Checkout
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </a>
