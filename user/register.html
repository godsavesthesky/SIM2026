<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="icon" type="image/x-icon" href="../asset/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    
    <title>Register | Customer - Mega Electronic</title>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen items-center justify-center p-4 overflow-x-hidden py-12">

    <div class="w-full max-w-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8 sm:mb-10">
            <img src="../asset/logo.png" alt="Mega Electronic" class="w-16 h-16 sm:w-20 sm:h-20 object-contain mx-auto mb-4">
            <h1 class="text-2xl sm:text-3xl font-bold text-black">Buat Akun Baru</h1>
            <p class="text-sm sm:text-base text-gray-600 mt-2">Daftar sekarang dan nikmati pengalaman berbelanja terbaik</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-3xl border border-gray-200 shadow-sm p-8 sm:p-10 md:p-12">

            <form class="flex flex-col gap-4">

                <!-- Full Name -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label>
                    <label class="flex items-center gap-3 border border-gray-300 rounded-full px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                        <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" placeholder="Masukkan nama lengkap Anda" class="w-full outline-none text-xs sm:text-sm bg-transparent">
                    </label>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-2">Email</label>
                    <label class="flex items-center gap-3 border border-gray-300 rounded-full px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                        <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m2 7 10 6 10-6"></path>
                        </svg>
                        <input type="email" placeholder="Masukkan email Anda" class="w-full outline-none text-xs sm:text-sm bg-transparent">
                    </label>
                </div>

                <!-- Phone Number -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-2">No. Telepon</label>
                    <label class="flex items-center gap-3 border border-gray-300 rounded-full px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                        <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <input type="tel" placeholder="Masukkan nomor telepon" class="w-full outline-none text-xs sm:text-sm bg-transparent">
                    </label>
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-2">Alamat</label>
                    <label class="flex items-start gap-3 border border-gray-300 rounded-2xl px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                        <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <textarea placeholder="Masukkan alamat lengkap Anda" class="w-full outline-none text-xs sm:text-sm bg-transparent resize-none" rows="3"></textarea>
                    </label>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-2">Password</label>
                    <label class="flex items-center gap-3 border border-gray-300 rounded-full px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                        <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" placeholder="Minimal 8 karakter" class="w-full outline-none text-xs sm:text-sm bg-transparent">
                    </label>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-2">Konfirmasi Password</label>
                    <label class="flex items-center gap-3 border border-gray-300 rounded-full px-4 sm:px-5 py-2.5 sm:py-3 focus-within:border-[#4A7EE0] transition">
                        <svg class="w-4 sm:w-5 h-4 sm:h-5 text-black shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" placeholder="Ulangi password Anda" class="w-full outline-none text-xs sm:text-sm bg-transparent">
                    </label>
                </div>

                <!-- Terms & Conditions -->
                <label class="flex items-start gap-2 sm:gap-3 mt-2">
                    <input type="checkbox" class="w-4 h-4 border-gray-300 rounded mt-0.5">
                    <span class="text-xs sm:text-sm text-gray-600">
                        Saya setuju dengan <a href="#" class="text-[#4A7EE0] hover:underline">Syarat & Ketentuan</a> dan <a href="#" class="text-[#4A7EE0] hover:underline">Kebijakan Privasi</a>
                    </span>
                </label>

                <!-- Register Button -->
                <a href="home_user.html" 
                   class="flex items-center justify-center gap-2 bg-[#2E2E2E] hover:bg-black text-white font-semibold py-2.5 sm:py-3 rounded-full transition mt-4">
                    Buat Akun
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </a>

                <!-- Login Link -->
                <p class="text-center text-xs sm:text-sm text-gray-600 mt-4">
                    Sudah punya akun?
                    <a href="login_awal.html" class="text-[#4A7EE0] font-medium hover:underline">Login di sini</a>
                </p>

            </form>
        </div>

        <!-- Footer Note -->
        <p class="text-center text-xs text-gray-500 mt-6">
            © 2026 Mega Elektronik. Kami menjaga privasi Anda dengan aman.
        </p>

    </div>

</body>
</html>
