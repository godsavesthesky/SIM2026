<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="icon" type="image/x-icon" href="../asset/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <title>Detail Pembayaran | Mega Electronic</title>
</head>
<body class="bg-white overflow-x-hidden">

    <!-- ===== NAVBAR ===== -->
    <nav class="flex items-center justify-between px-6 sm:px-10 py-4 border-b border-gray-100 sticky top-0 bg-white z-50">
        <div class="flex items-center gap-2">
            <img src="../asset/logo.png" alt="Mega Electronic" class="w-8 h-8 object-contain">
        </div>

        <div class="hidden lg:flex items-center gap-8 text-sm font-medium text-gray-700">
            <a href="home_user.html" class="hover:text-[#4A7EE0] transition">Home</a>
            <a href="produk1_user.html" class="hover:text-[#4A7EE0] transition">Product</a>
            <a href="produk1_user.html" class="hover:text-[#4A7EE0] transition">Gadget</a>
            <a href="produk2_user.html" class="hover:text-[#4A7EE0] transition">Networking</a>
            <a href="#" class="hover:text-[#4A7EE0] transition">About Us</a>
            <a href="home_user.html#contact" class="hover:text-[#4A7EE0] transition">Contact</a>
        </div>

        <div class="flex items-center gap-4">
            <label class="hidden md:flex items-center gap-2 bg-gray-100 rounded-full px-4 py-2 w-52">
                <svg class="w-4 h-4 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" placeholder="Search products..." class="bg-transparent outline-none text-sm w-full">
            </label>

            <a href="profile.html" class="w-9 h-9 flex items-center justify-center rounded-full bg-black text-white hover:bg-gray-800 transition" title="Akun">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                </svg>
            </a>
            <a href="order.html" class="w-9 h-9 flex items-center justify-center rounded-full border border-gray-300 hover:border-black transition" title="Keranjang">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </a>
        </div>
    </nav>

    <!-- ===== DETAIL PEMBAYARAN ===== -->
    <main class="max-w-4xl mx-auto px-6 sm:px-10 py-10 sm:py-14">

        <div class="bg-white border border-gray-200 rounded-3xl p-6 sm:p-10">

            <div class="inline-block border border-gray-300 rounded-2xl px-6 py-3 mb-8">
                <h1 class="text-lg sm:text-xl font-bold text-black">Detail Pembayaran</h1>
            </div>

            <div class="flex flex-col md:flex-row gap-10">

                <!-- ===== QRIS POSTER ===== -->
                <div class="flex justify-center md:justify-start">
                    <div class="w-72 rounded-2xl border border-gray-200 shadow-sm overflow-hidden bg-white">
                        <img src="../asset/qris.jpg" alt="QRIS Mega Electronic" class="w-full h-auto object-contain">
                    </div>
                </div>

                <!-- Total & Upload -->
                <div class="flex-1 flex flex-col gap-8">
                    <div class="max-w-xs">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Total Harga</label>
                        <input type="text" value="Rp 1.198.000" readonly
                               class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-sm bg-gray-50 outline-none font-medium">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Bukti Transaksi</label>
                        <label class="flex items-center gap-3 border border-gray-300 rounded-full px-2 py-2 w-fit cursor-pointer">
                            <span class="bg-gray-500 text-white text-sm font-medium px-4 py-2 rounded-full">Choose file</span>
                            <span class="text-sm text-gray-400 pr-3">No file choosen</span>
                            <input type="file" class="hidden">
                        </label>
                    </div>

                    <button type="button"
                            class="w-fit flex items-center justify-center gap-2 bg-green-700 hover:bg-green-800 text-white font-semibold py-2.5 px-8 rounded-full transition">
                        Upload
                    </button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
