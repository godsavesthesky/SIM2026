<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <title>Profile | Mega Electronic</title>
</head>
<body class="bg-white overflow-x-hidden">

    <!-- ===== NAVBAR ===== -->
    <nav class="flex items-center justify-between px-6 sm:px-10 py-4 border-b border-gray-100 sticky top-0 bg-white z-50">
        <div class="flex items-center gap-2">
            <img src="../asset/logo.png" alt="Mega Electronic" class="w-8 h-8 object-contain">
        </div>

        <div class="hidden lg:flex items-center gap-8 text-sm font-medium text-gray-700">
            <a href="home_user.html" class="hover:text-[#4A7EE0] transition">Home</a>
            <a href="produk1_user.html" class="hover:text-[#4A7EE0] transition">Product</a>
            <a href="produk1_user.html" class="hover:text-[#4A7EE0] transition">Gadget</a>
            <a href="produk2_user.html" class="hover:text-[#4A7EE0] transition">Networking</a>
            <a href="#" class="hover:text-[#4A7EE0] transition">About Us</a>
            <a href="home_user.html#contact" class="hover:text-[#4A7EE0] transition">Contact</a>
        </div>

        <div class="flex items-center gap-4">
            <label class="hidden md:flex items-center gap-2 bg-gray-100 rounded-full px-4 py-2 w-52">
                <svg class="w-4 h-4 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" placeholder="Search products..." class="bg-transparent outline-none text-sm w-full">
            </label>

            <a href="profile.html" class="w-9 h-9 flex items-center justify-center rounded-full bg-black text-white hover:bg-gray-800 transition" title="Akun">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                </svg>
            </a>
            <a href="order.html" class="w-9 h-9 flex items-center justify-center rounded-full border border-gray-300 hover:border-black transition" title="Keranjang">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </a>
        </div>
    </nav>

    <!-- ===== PROFILE ===== -->
    <main class="max-w-4xl mx-auto px-6 sm:px-10 py-10 sm:py-14">

        <div class="bg-white border border-gray-200 rounded-3xl p-6 sm:p-10">

            <div class="inline-block border border-gray-300 rounded-2xl px-6 py-3 mb-8">
                <h1 class="text-lg sm:text-xl font-bold text-black">Profile</h1>
            </div>

            <form class="flex flex-col gap-6">

                <!-- Foto -->
                <div class="flex items-center gap-6 flex-wrap">
                    <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gray-200 shrink-0"></div>
                    <div>
                        <p class="font-semibold text-black mb-3">Ganti Foto</p>
                        <label class="flex items-center gap-3 border border-gray-300 rounded-full px-2 py-2 w-fit cursor-pointer">
                            <span class="bg-gray-500 text-white text-sm font-medium px-4 py-2 rounded-full">Choose file</span>
                            <span class="text-sm text-gray-400 pr-3">No file choosen</span>
                            <input type="file" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- Nama Lengkap -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label>
                    <input type="text" value="Jihan Dwi Sachoya"
                           class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                </div>

                <!-- No Telp -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">No. Telp</label>
                    <input type="tel" value="085111310829"
                           class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" value="workwithjihan@gmail.com"
                           class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                </div>

                <!-- Alamat -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Alamat</label>
                    <input type="text" value="Jl. Merdekanya kapan ini"
                           class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                </div>

                <!-- Tanggal Lahir -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tanggal Lahir</label>
                    <input type="text" value="31 Agustus 2006"
                           class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-sm outline-none focus:border-[#4A7EE0] transition">
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <a href="reset_password.html" class="text-sm text-[#4A7EE0] hover:underline font-medium">Reset Password</a>
                    </div>
                    <label class="flex items-center gap-3 border border-gray-300 rounded-2xl px-4 py-3 focus-within:border-[#4A7EE0] transition">
                        <input type="password" value="Surabaya#1" readonly class="w-full outline-none text-sm bg-transparent">
                        <svg class="w-5 h-5 text-gray-400 shrink-0 cursor-pointer hover:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </label>
                </div>

                <!-- Buttons -->
                <div class="flex items-center justify-between mt-4">
                    <a href="home_user.html"
                       class="px-8 py-2.5 rounded-full font-semibold text-white bg-red-500 hover:bg-red-600 transition">
                        Batal
                    </a>
                    <a href="home_user.html"
                       class="px-8 py-2.5 rounded-full font-semibold text-white bg-green-700 hover:bg-green-800 transition">
                        Simpan Perubahan
                    </a>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
